<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clown Fiesta Food Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<h1 class="rainbow-title">🎪 CLOWN FIESTA</h1>
<p class="subtitle">Food Cost Calculator</p>

<div class="player-section">
<label>Player Name</label>
<input type="text" id="playerName" placeholder="Enter character name">
</div>

<div id="foods"></div>

<div class="summary-card">
<h2>Order Summary</h2>
<div id="orderSummary">No items selected yet</div>
<h3>Total: <span id="grandTotal">0</span> Zeny</h3>
<button onclick="copyOrder()">Copy Order For Discord</button>
<button onclick="resetAll()">Reset</button>
</div>
</div>
<script src="script.js"></script>
</body>
</html>
