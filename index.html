<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clown Fiesta Food Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<header class="hero">
<h1 class="rainbow">🎪 CLOWN FIESTA</h1>
<p class="subtitle">Ragnarok Food Cost Calculator</p>
<input id="playerName" placeholder="Character Name">
</header>

<div class="layout">
<div id="foodGrid" class="food-grid"></div>

<div class="summary">
<h2>Order Summary</h2>
<div id="orderSummary">No items selected</div>
<h3>Total: <span id="grandTotal">0</span> Zeny</h3>
<button onclick="copyOrder()">Copy Order</button>
<button onclick="resetAll()">Reset</button>
</div>
</div>
</div>
<script src="script.js"></script>
</body>
</html>
